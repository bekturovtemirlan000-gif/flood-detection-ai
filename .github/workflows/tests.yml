name: Tests
on: [push, pull_request]
jobs:
  raster-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m unittest -v
